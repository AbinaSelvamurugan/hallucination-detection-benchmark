[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "hallubench"
version = "0.1.0"
description = "Evidence-grounded, leakage-resistant hallucination detector benchmark"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "scipy>=1.11,<2", "matplotlib>=3.7,<4", "PyYAML>=6,<7", "joblib>=1.3,<2"]
[project.optional-dependencies]
hf = ["datasets>=3,<5", "huggingface-hub>=0.25,<2", "pyarrow>=15,<24"]
models = ["transformers>=4.45,<5", "torch>=2.2,<3", "sentence-transformers>=3,<6", "sentencepiece>=0.2"]
judge = ["openai>=1.40,<3"]
dashboard = ["streamlit>=1.35,<2", "plotly>=5,<7"]
test = ["pytest>=8,<10"]
[project.scripts]
hallubench = "hallubench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
